name: Nightly APK

on:
  workflow_dispatch:
  schedule:
    - cron: "15 20 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Prepare local Android settings
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          sed -i '/org.gradle.java.home=/d' gradle.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/lilt-nightly.apk

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Lilt Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/lilt-nightly.apk
          body: |
            Automated nightly prerelease build.

            This APK is for early testing and may contain unfinished features.
